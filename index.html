<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>RETRO ARENA</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
body {
background: #111;
color: #fff;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
overflow: hidden;
}
/* 시작 화면 배경 이미지 */
#lobby {
position: fixed;
inset: 0;
background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)), url('/bg.png') center/cover no-repeat;
display: flex;
justify-content: center;
align-items: center;
z-index: 10;
}
.panel {
background: rgba(20, 24, 35, 0.92);
border: 2px solid #00d2ff;
border-radius: 14px;
padding: 24px 30px;
width: 680px;
max-width: 95vw;
box-shadow: 0 0 30px rgba(0, 210, 255, 0.25);
}
h1 { text-align: center; color: #00d2ff; margin-bottom: 18px; letter-spacing: 2px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
label { display: block; font-size: 13px; color: #aaa; margin: 8px 0 4px; }
input, select {
width: 100%; padding: 8px 10px; border-radius: 6px;
border: 1px solid #444; background: #1e2433; color: #fff;
}
.skins { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.skin-btn {
width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
border: 2px solid transparent; transition: transform 0.15s;
}
.skin-btn.active { border-color: #fff; transform: scale(1.2); }
#mapPreview {
width: 100%; height: 180px; background: #151922;
border: 1px solid #444; border-radius: 8px; margin-top: 6px;
}
.start-btn {
width: 100%; margin-top: 18px; padding: 12px; font-size: 16px; font-weight: bold;
background: #00d2ff; color: #000; border: none; border-radius: 8px; cursor: pointer;
}
.start-btn:hover { background: #38e0ff; }
#gameWrap { display: none; position: relative; }
#hud {
position: absolute; top: 10px; left: 10px; right: 10px;
display: flex; justify-content: space-between; pointer-events: none;
font-size: 14px; font-weight: bold; text-shadow: 1px 1px 3px #000;
}
#banner {
position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
font-size: 36px; font-weight: bold; color: #ffdd59;
text-shadow: 0 0 15px #000; pointer-events: none; text-align: center;
}
#gameCanvas { background: #181c24; border: 2px solid #444; border-radius: 8px; display: block; }
</style>
</head>
<body>

<div id="lobby">
<div class="panel">
<h1>RETRO ARENA</h1>
<div class="grid">
<div>
<label>닉네임</label>
<input id="nickname" value="플레이어1" maxlength="10" />

<label>스킨 색상</label>
<div class="skins" id="skinList"></div>

<label>방 이름 (친구와 동일하게 입력)</label>
<input id="roomId" value="arena1" />

<label>게임 모드 (3판 2선승제)</label>
<select id="mode">
<option value="1v1">1 : 1 (2명)</option>
<option value="1v1v1">1 : 1 : 1 (3명)</option>
<option value="2v2">2 : 2 팀전 (4명)</option>
</select>

<label>무기</label>
<select id="weapon">
<option value="gun">총 (원거리)</option>
<option value="sword">칼 (근거리)</option>
</select>

<label>초능력 (E 키 사용)</label>
<select id="skill">
<option value="bind">속박 (쿨 15초 / 5초 내 스페이스 10회 해제)</option>
<option value="invis">투명화 (쿨 15초 / 5초간 은신)</option>
<option value="dash">대시 (쿨 7초 / 순간이동)</option>
<option value="shield">쉴드 (쿨 12초 / 3초 무적)</option>
</select>
</div>

<div>
<label>맵 선택</label>
<select id="mapId"></select>
<label>맵 미리보기</label>
<canvas id="mapPreview" width="300" height="200"></canvas>
<p style="font-size:12px; color:#aaa; margin-top:10px; line-height:1.5;">
<b>조작법</b><br>
이동: WASD | 공격: 마우스 좌클릭<br>
초능력: E | 속박 해제: Space 연속 10회
</p>
</div>
</div>
<button class="start-btn" id="joinBtn">게임 참가</button>
</div>
</div>

<div id="gameWrap">
<div id="hud">
<div id="roundInfo">대기 중...</div>
<div id="skillInfo">초능력 준비 완료 (E)</div>
</div>
<div id="banner"></div>
<canvas id="gameCanvas" width="900" height="600"></canvas>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const SKINS = ['#ff4757', '#1e90ff', '#ff6b81', '#70a1ff', '#eccc68', '#2ed573', '#a55eea', '#ffa502', '#00d2d3', '#ffffff'];
let selectedSkin = SKINS[0];
let mapsData = {};
let myId = null;
let currentMapId = 'classic';
let gameState = null;
const keys = { w: false, a: false, s: false, d: false };
let mouse = { x: 450, y: 300 };

// 스킨 버튼 생성
const skinList = document.getElementById('skinList');
SKINS.forEach((color, idx) => {
const btn = document.createElement('div');
btn.className = 'skin-btn' + (idx === 0 ? ' active' : '');
btn.style.background = color;
btn.onclick = () => {
document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
selectedSkin = color;
};
skinList.appendChild(btn);
});

// 맵 미리보기 그리기
function drawMapPreview(mapId) {
const map = mapsData[mapId];
if (!map) return;
const c = document.getElementById('mapPreview');
const ctx = c.getContext('2d');
ctx.clearRect(0, 0, c.width, c.height);
const sx = c.width / map.width;
const sy = c.height / map.height;

ctx.fillStyle = '#181c24';
ctx.fillRect(0, 0, c.width, c.height);
ctx.fillStyle = '#4b5563';
map.obstacles.forEach(o => {
ctx.fillRect(o.x * sx, o.y * sy, o.w * sx, o.h * sy);
});
}

socket.on('mapsData', (data) => {
mapsData = data;
const sel = document.getElementById('mapId');
sel.innerHTML = '';
Object.entries(data).forEach(([id, m]) => {
const opt = document.createElement('option');
opt.value = id;
opt.textContent = m.name;
sel.appendChild(opt);
});
drawMapPreview(sel.value);
sel.onchange = () => drawMapPreview(sel.value);
});

document.getElementById('joinBtn').onclick = () => {
socket.emit('joinRoom', {
roomId: document.getElementById('roomId').value,
nickname: document.getElementById('nickname').value,
skin: selectedSkin,
mode: document.getElementById('mode').value,
mapId: document.getElementById('mapId').value,
weapon: document.getElementById('weapon').value,
skill: document.getElementById('skill').value
});
};

socket.on('errorMsg', (msg) => alert(msg));

socket.on('joined', (info) => {
myId = info.id;
currentMapId = info.mapId;
document.getElementById('lobby').style.display = 'none';
document.getElementById('gameWrap').style.display = 'block';
document.getElementById('banner').textContent = 상대방 대기 중... (${info.mode})`;
});

socket.on('roundStart', ({ round }) => {
document.getElementById('banner').textContent = ROUND${round} START!`;
setTimeout(() => { document.getElementById('banner').textContent = ''; }, 1200);
});

socket.on('roundEnding', ({ winnerName }) => {
document.getElementById('banner').textContent = KO! ${winnerName} 라운드 승리!`;
});

socket.on('matchOver', ({ winnerName }) => {
document.getElementById('banner').innerHTML = 🏆 최종 우승:${winnerName}<br><span style="font-size:16px">새로고침하여 다시 시작</span>`;
});

socket.on('state', (state) => {
gameState = state;
render();
});

// 입력 이벤트
window.addEventListener('keydown', (e) => {
const k = e.key.toLowerCase();
if (k in keys) keys[k] = true;
if (k === 'e') socket.emit('useSkill');
if (e.code === 'Space') {
e.preventDefault();
socket.emit('bindSpace');
}
});
window.addEventListener('keyup', (e) => {
const k = e.key.toLowerCase();
if (k in keys) keys[k] = false;
});

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.addEventListener('mousemove', (e) => {
const rect = canvas.getBoundingClientRect();
mouse.x = e.clientX - rect.left;
mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', () => socket.emit('attack'));

setInterval(() => {
if (!gameState || !myId || !gameState.players[myId]) return;
const me = gameState.players[myId];
const angle = Math.atan2(mouse.y - me.y, mouse.x - me.x);
socket.emit('input', { ...keys, angle });
}, 1000 / 60);

function render() {
if (!gameState) return;
const map = mapsData[currentMapId];
if (!map) return;

ctx.clearRect(0, 0, canvas.width, canvas.height);

// 장애물
ctx.fillStyle = '#3b4252';
map.obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

const now = gameState.now;
const me = gameState.players[myId];

// HUD 업데이트
if (me) {
const cd = Math.max(0, Math.ceil((me.skillCd - now) / 1000));
document.getElementById('skillInfo').textContent = cd > 0 ? 초능력 쿨타임: ${cd}초: '초능력 준비 완료 (E)'; document.getElementById('roundInfo').textContent =ROUND ${gameState.round} | 내 승수: ${gameState.wins[me.team] || 0}승`;
}

// 플레이어 렌더링
Object.values(gameState.players).forEach((p) => {
if (!p.alive) return;
const isMe = p.id === myId;
const isInvis = now < p.invisUntil;

// 상대방 화면에서 투명화 중이면 캐릭터 & 무기 숨김
if (isInvis && !isMe) return;

ctx.save();
if (isInvis && isMe) ctx.globalAlpha = 0.35;

// 캐릭터 본체 (속박 2단계일 때 회색)
ctx.beginPath();
ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
ctx.fillStyle = p.bindStage === 2 ? '#808080' : p.skin;
ctx.fill();
ctx.lineWidth = 2;
ctx.strokeStyle = '#fff';
ctx.stroke();

// 쉴드 표시
if (now < p.shieldUntil) {
ctx.beginPath();
ctx.arc(p.x, p.y, 25, 0, Math.PI * 2);
ctx.strokeStyle = '#00d2ff';
ctx.lineWidth = 3;
ctx.stroke();
}

// 무기 (투명화 중에는 상대에게 안 보이고, 본인 화면에서는 반투명으로 보임)
ctx.strokeStyle = '#ddd';
ctx.lineWidth = 5;
ctx.beginPath();
ctx.moveTo(p.x, p.y);
ctx.lineTo(p.x + Math.cos(p.angle) * 26, p.y + Math.sin(p.angle) * 26);
ctx.stroke();

ctx.restore();

// 닉네임 & 체력바
ctx.fillStyle = '#fff';
ctx.font = '12px sans-serif';
ctx.textAlign = 'center';
ctx.fillText(p.nickname, p.x, p.y - 34);

ctx.fillStyle = '#333';
ctx.fillRect(p.x - 20, p.y - 28, 40, 5);
ctx.fillStyle = '#2ed573';
ctx.fillRect(p.x - 20, p.y - 28, 40 * (p.hp / 100), 5);

// 속박 UI (1단계: 5초 게이지 + 열린 자물쇠 + 스페이스 카운트 / 2단계: 잠긴 자물쇠)
if (p.bindStage === 1) {
const ratio = Math.max(0, (p.bindUntil - now) / 5000);
ctx.fillStyle = '#222';
ctx.fillRect(p.x - 25, p.y - 52, 50, 7);
ctx.fillStyle = '#ff9f43';
ctx.fillRect(p.x - 25, p.y - 52, 50 * ratio, 7);
ctx.font = '16px sans-serif';
ctx.fillText(🔓${p.bindSpaceCount}/10`, p.x, p.y - 58);
} else if (p.bindStage === 2) {
ctx.font = '18px sans-serif';
ctx.fillText('🔒', p.x, p.y - 50);
}
});

// 총알 (투명화 상태여도 보임)
gameState.bullets.forEach((b) => {
ctx.beginPath();
ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
ctx.fillStyle = b.color;
ctx.fill();
});

// 칼 휘두르는 모션 (투명화 상태여도 보임)
gameState.slashes.forEach((s) => {
ctx.save();
ctx.beginPath();
ctx.arc(s.x, s.y, 60, s.angle - 0.9, s.angle + 0.9);
ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
ctx.lineWidth = 6;
ctx.stroke();
ctx.restore();
});

// 초능력 및 타격 이펙트 (투명화 상태여도 보임)
gameState.effects.forEach((e) => {
ctx.save();
ctx.beginPath();
ctx.arc(e.x, e.y, 35 - e.ttl, 0, Math.PI * 2);
ctx.strokeStyle = e.type === 'ko' ? '#ff4757' : e.type === 'bindCast' ? '#ff9f43' : '#00d2ff';
ctx.lineWidth = 3;
ctx.stroke();
ctx.restore();
});
}
</script>
</body>
</html>
